# Clef checks for this public fork. Standard GitHub-hosted runners are free
# on a public repository. This job does not use vLLM's Buildkite GPU fleet.
name: clef

on:
  workflow_dispatch:
  push:
    branches: [clef]
    tags: ["v*-clef*"]
  pull_request:
    branches: [clef]

permissions:
  contents: read

concurrency:
  group: clef-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.16 pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint Clef files
        run: |
          ruff check \
            vllm/transformers_utils/clef.py \
            vllm/model_executor/models/clef.py \
            vllm/model_executor/models/clef_schema.py \
            vllm/entrypoints/serve/systemone \
            tests/models/test_clef_schema.py
          ruff format --check \
            vllm/transformers_utils/clef.py \
            vllm/model_executor/models/clef.py \
            vllm/model_executor/models/clef_schema.py \
            vllm/entrypoints/serve/systemone \
            tests/models/test_clef_schema.py
      - name: Test the joint schema head
        run: python -m pytest tests/models/test_clef_schema.py -q --noconftest
      - name: Syntax-check the vLLM integration modules
        run: |
          python -m py_compile \
            vllm/transformers_utils/clef.py \
            vllm/model_executor/models/clef.py \
            vllm/model_executor/models/clef_schema.py \
            vllm/entrypoints/serve/systemone/__init__.py \
            vllm/entrypoints/serve/systemone/api_router.py
